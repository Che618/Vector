<!doctype html><html lang="zh-CN" data-theme="classic"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#103c78"><title>工作台总览 · 张量向量库</title><link rel="icon" href="./assets/mark.svg"><link rel="stylesheet" href="./styles/theme.css"><link rel="stylesheet" href="./styles/workspace.css"></head>
<body><div id="app" v-cloak>
<div v-if="mobile" class="nav-shade" @click="mobile=false"></div>
<aside class="rail" :class="{opened:mobile}"><div class="identity"><img src="./assets/mark.svg" alt=""><div><strong>张量向量库</strong><small>TENSOR WORKSPACE</small></div></div>
<nav aria-label="主导航"><section v-for="group in groups"><h2>{{group}}</h2><a v-for="g in guides.filter(x=>x[3]===group)" :href="'#/'+g[0]" :class="{selected:page===g[0]}" :aria-current="page===g[0]?'page':undefined" @click="mobile=false"><i-c :name="g[2]" :size="19"></i-c>{{g[1]}}</a></section></nav>
<div class="rail-foot"><i-c name="flask" :size="22"></i-c><div><b>北京交通大学</b><small>科学数据实验空间</small></div></div></aside>
<div class="workspace"><header class="topbar"><div class="crumb"><button class="mobile-menu icon-btn" @click="mobile=true" aria-label="打开导航"><i-c name="menu"></i-c></button><i-c name="grid" :size="16"></i-c><span>{{info[3]}}</span><em>/</em><b>{{info[1]}}</b></div><div class="top-actions"><span class="env-pill"><i></i>演示环境</span><button class="icon-btn" @click="themeSwitch" :aria-label="'切换至'+(theme==='classic'?'智能':'传统')+'主题'" :title="'当前'+(theme==='classic'?'传统':'智能')+'主题，点击切换'"><i-c name="sun"></i-c></button><button class="icon-btn" aria-label="操作指南" title="操作指南" @click="open('guide')"><i-c name="book"></i-c></button><span class="top-divider"></span><span class="avatar" title="北交大演示用户">北</span></div></header>
<main id="main-content" :key="page">
<template v-if="page==='home'"><section class="hero"><div class="hero-grid"></div><img class="hero-art" src="./assets/tensor-grid.svg" alt=""><div class="hero-copy"><div class="hero-org"><span></span>北京交通大学<span class="org-rule"></span>科学数据平台</div><h1>科学数据向量工作台</h1><p>从原始科学数据到可检索的向量索引。</p><div class="hero-actions"><a class="hero-primary" href="#/intake"><i-c name="plus" :size="16"></i-c>接入数据</a><a class="hero-secondary" href="#/search"><i-c name="search" :size="16"></i-c>相似检索</a></div></div></section>
<div class="workflow"><a v-for="(a,i) in steps" :href="'#/'+a.page" class="flow-card card"><div class="flow-top"><span class="icon-tile" :class="a.tone"><i-c :name="a.ic" :size="22"></i-c></span><span class="step-no">STEP 0{{i+1}}</span></div><h2>{{a.title}}</h2><p>{{a.desc}}</p><div class="flow-foot"><span>{{a.stat}}</span><i-c name="next" :size="14"></i-c></div></a></div>
<div class="eng-dash"><section class="card pad benchmark-summary"><div class="card-title bare"><div><h2>检索基准对照</h2><p>内置 10 道标注查询 · 33 条文本向量 · Hit@3</p></div><a class="link" href="#/evaluate">进入评测<i-c name="next" :size="14"></i-c></a></div><div class="result-bars compact"><div v-for="(name,m) in names" :class="'bar-'+m"><span>{{name}}</span><div><i :style="{width:referenceBenchmark.metrics[m].hit*100+'%'}"></i></div><b>{{referenceBenchmark.metrics[m].hits}} / 10</b></div></div></section>
<section class="card pad"><div class="card-title bare"><h2>工程验证</h2></div><div class="lab-actions"><button @click="sampleQC"><span class="source-icon teal"><i-c name="shield"></i-c></span><span><b>分片质检案例</b><small>查看重复、过短与无效记录</small></span></button><a href="#/versions"><span class="source-icon violet"><i-c name="branch"></i-c></span><span><b>索引版本对照</b><small>追加观测，复现旧版结果</small></span></a></div></section></div>
<div class="dashboard-row"><section class="card index-overview"><div class="card-title"><div><h2>向量索引概览</h2><p>最近写入的科学数据索引</p></div><a class="link" href="#/indexes">查看全部<i-c name="next" :size="14"></i-c></a></div><div class="table-scroll"><table><thead><tr><th>索引名称</th><th>向量数</th><th>维度</th><th>状态</th></tr></thead><tbody><tr v-for="d in indexed.slice(0,5)"><td><button class="name-btn" @click="browse(d)"><ds-name :d="d"></ds-name></button></td><td class="num">{{d.records.length}}</td><td class="num dim">{{dim(d)}} D</td><td><span class="badge ok">已索引</span></td></tr></tbody></table></div></section>
<section class="card space-card"><div class="card-title"><div><h2>向量空间投影</h2><p>文本索引的二维特征投影</p></div><span class="tag">2D</span></div><div class="space-body"><space-plot :points="points" @select="showRec"></space-plot><div class="scatter-key"><span v-for="k in plotDomains"><i :style="{background:domains[k].color}"></i>{{k}}</span></div></div></section></div>
<section class="card quick"><span class="icon-tile blue"><i-c name="search"></i-c></span><div><h2>检索试验台</h2><p>输入科学概念，查看相似片段与来源。</p></div><form @submit.prevent="quickSearch"><input v-model.trim="quick" placeholder="试试「海水温度变化」" aria-label="快速检索"><button class="btn primary">运行检索</button></form></section></template>
<template v-else><div class="page-header"><div><div class="page-kicker">{{info[3]}}</div><h1>{{info[1]}}</h1><p>{{desc[page]}}</p></div><a v-if="page==='indexes'" class="btn primary" href="#/intake"><i-c name="plus" :size="16"></i-c>接入数据</a></div>
<template v-if="page==='prepare'">
<section class="card pad"><div class="card-title bare"><div><h2>分片方案</h2><p>先比较输入和输出，再将选定片段送入编码。</p></div><button class="btn" @click="sampleQC"><i-c name="flask" :size="16"></i-c>载入质检案例</button></div>
<label>来源数据集<select v-model="selected"><option v-for="d in s.sources" :value="d.id">{{d.name}} · {{d.id}} · {{d.state}}</option></select></label>
<div class="form-grid three eng-rule" v-if="current.mode==='text'"><label>最短保留记录（字符）<input type="number" v-model.number="rules.min" min="1"></label><label>分片长度（字符）<input type="number" v-model.number="rules.width" min="12" max="1400"></label><label>片段重叠（字符）<input type="number" v-model.number="rules.overlap" min="0"></label></div>
<div class="eng-options"><label class="inline-check"><input type="checkbox" v-model="rules.unique">排除重复记录</label><span class="sub">{{current.mode==='text'?'无有效字符的记录自动排除。':'保持原始张量形状，排除零张量。'}}</span></div><div class="action-row"><button class="btn primary" @click="checkQuality">预览质检结果</button><button class="btn" @click="toEncode(current)">沿用当前片段</button></div><p v-if="err" class="error" role="alert">{{err}}</p></section>
<section v-if="quality" class="card"><div class="card-title"><div><h2>质检报告</h2><p>每条排除记录都保留原因和源位置。</p></div><button class="btn primary" :disabled="!quality.stats.output" @click="applyQuality">采用方案并去编码</button></div>
<div class="eng-metrics"><div><small>输入记录</small><b>{{quality.stats.input}}</b></div><div><small>保留记录</small><b>{{quality.stats.kept}}</b></div><div><small>排除记录</small><b>{{quality.stats.input-quality.stats.kept}}</b></div><div><small>输出片段</small><b>{{quality.stats.output}}</b></div></div>
<div class="filters"><select v-model="qFilter" aria-label="质检结果筛选"><option value="">所有记录</option><option value="excluded">仅排除项</option><option value="kept">仅保留项</option></select><span class="quiet">重复 {{quality.stats.duplicate}} · 过短 {{quality.stats.short}} · 无效 {{quality.stats.invalid}}</span></div>
<div class="table-scroll"><table class="wrap-table"><thead><tr><th>源位置</th><th>原始内容</th><th>处理结果</th></tr></thead><tbody><tr v-for="r in visibleQuality"><td>{{r.loc}}</td><td>{{r.text}}</td><td><span class="badge" :class="r.flag==='kept'?'ok':'warn'">{{r.flag==='kept'?'保留 · '+r.count+' 片':r.reason}}</span></td></tr></tbody></table></div><pager :n="qualityPage" :total="qualityRows.length" @turn="qualityPage=$event"></pager><div class="eng-note" v-if="current.state==='已索引'">对已发布索引采用新方案会生成一个可追溯的派生数据源。</div></section>
<section v-else class="card"><empty-v msg="选择数据集并预览，或载入带有异常记录的质检案例。"></empty-v></section></template>
<template v-if="page==='versions'&&versionSource">
<section class="card pad"><div class="card-title bare"><h2>服务中的索引</h2><span class="badge ok">已启用 v{{versionSource.active}}</span></div><label>选择索引<select v-model="target"><option v-for="d in indexed" :value="d.id">{{d.name}} · {{d.id}}</option></select></label><div class="facts"><div><small>当前向量数</small><b>{{versionSource.records.length}}</b></div><div><small>维度</small><b>{{dim(versionSource)}} D</b></div><div><small>已保存版本</small><b>{{history.length}}</b></div><div><small>来源格式</small><b>{{versionSource.format}}</b></div></div></section>
<div class="eng-cols"><section class="card pad"><div class="card-title bare"><h2>追加增量批次</h2><button class="link" @click="addExample">加载增量示例</button></div><label>新增记录 · {{versionSource.format}}<textarea rows="4" v-model="addition" placeholder="按当前索引的格式输入，重复内容将在预检时跳过。"></textarea></label><label class="spaced">版本说明<input v-model.trim="memo" maxlength="90" placeholder="例如：补录第二批浮标观测"></label><div class="action-row"><button class="btn" @click="previewBatch">预检增量</button><button class="btn primary" :disabled="!batch?.next.length" @click="publishBatch">发布新版本</button></div><p v-if="err" class="error" role="alert">{{err}}</p><div class="notice spaced" v-if="batch">输入 {{batch.input}} 条，跳过重复 {{batch.omitted.length}} 条，待追加 {{batch.next.length}} 条。</div></section>
<section class="card pad"><div class="card-title bare"><h2>版本历史</h2></div><div v-for="v in history" class="release"><span class="rev-dot"></span><div class="grow"><strong>v{{v.n}} · {{v.summary}}</strong><small>{{v.count}} 条向量 · {{clock(v.at)}}</small></div><span v-if="v.n===versionSource.active" class="badge ok">当前</span><button v-else class="link" @click="switchVersion(v.n)">启用 v{{v.n}}</button></div><div class="eng-note">切换后，可在相同查询下复现该版本的检索结果。</div></section></div>
<section class="card pad" v-if="comparison"><div class="card-title bare"><h2>与当前版本比较</h2><button class="link" @click="searchSource(versionSource)">检索当前版本</button></div><label>对照版本<select v-model.number="compareNo"><option v-for="v in history" :value="v.n">v{{v.n}} · {{v.count}} 条向量</option></select></label><div class="notice spaced">v{{comparison.base}} 至当前 v{{comparison.now}}，{{comparison.delta>=0?'新增':'减少'}} {{Math.abs(comparison.delta)}} 条可检索向量。</div><details v-if="comparison.rows.length" class="eng-detail"><summary>查看差异片段（{{comparison.rows.length}}）</summary><div class="entry" v-for="r in comparison.rows"><div><b>{{r.loc}}</b><small>{{r.text}}</small></div></div></details></section></template>
<template v-if="page==='evaluate'">
<section class="card pad"><div class="card-title bare"><div><h2>实验配置</h2><p>固定语料、标注和 Top K，在相同条件下比较三种排序策略。</p></div><span class="tag">{{textIndexes.length}} 个文本索引</span></div><div class="form-grid three"><label>标注题集<select v-model="caseMode"><option value="all">全部标注</option><option value="seed">内置科学查询</option><option value="custom">自定义查询</option></select></label><label>候选深度<select v-model.number="k"><option v-for="n in [1,3,5,10]" :value="n">Top {{n}}</option></select></label><label>混合排序的向量权重<select v-model.number="weight"><option v-for="n in [.25,.5,.6,.75]" :value="n">{{Math.round(n*100)}}%</option></select></label></div><div class="action-row"><button class="btn primary" @click="runEval"><i-c name="play" :size="15"></i-c>运行对比实验</button><button class="btn" @click="startCase">添加评测题</button><span class="quiet">{{availableCases.length}} 道可用题<span v-if="availableCases.length<candidates.length"> · {{candidates.length-availableCases.length}} 道标注暂不在当前索引版本</span></span></div>
<details class="eng-detail"><summary>查看当前标注题集</summary><div class="entry" v-for="a in availableCases"><div><b>{{a.id}} · {{a.q}}</b><small>预期命中 {{ds(a.ds).name}} · {{a.ids.map(i=>ds(a.ds).records[i].loc).join(' / ')}}</small></div></div></details>
<form class="case-form" v-if="caseForm.show" @submit.prevent="addCase"><label>评测查询<input required v-model.trim="caseForm.q" maxlength="160" placeholder="用一句话描述要找的片段"></label><div class="form-grid"><label>相关数据集<select v-model="caseForm.ds" @change="caseForm.i=0"><option v-for="d in textIndexes" :value="d.id">{{d.name}}</option></select></label><label>相关片段<select v-model.number="caseForm.i"><option v-for="(r,i) in caseDocs" :value="i">{{r.loc}} · {{r.text.slice(0,26)}}</option></select></label></div><div class="action-row"><button class="btn primary">保存标注</button><button class="btn" type="button" @click="caseForm.show=false">取消</button></div></form><p class="error" role="alert" v-if="err">{{err}}</p></section>
<section v-if="report" class="card"><div class="card-title"><div><h2>检索效果对比</h2><p>{{report.rows.length}} 道标注查询 · {{report.count}} 条候选向量 · 混合向量权重 {{Math.round(report.alpha*100)}}%</p></div><button class="btn" @click="exportRun"><i-c name="download" :size="15"></i-c>导出实验报告</button></div>
<div class="experiment-select"><label>实验记录<select v-model="reportId"><option v-for="r in s.experiments" :value="r.id">{{clock(r.at)}} · Top {{r.k}} · {{r.rows.length}} 题</option></select></label></div>
<div class="result-bars"><div v-for="(name,method) in names" :class="'bar-'+method"><span>{{name}}</span><div><i :style="{width:(report.metrics[method].hit*100)+'%'}"></i></div><b>{{(report.metrics[method].hit*100).toFixed(0)}}%</b><small>MRR@{{report.k}} {{report.metrics[method].mrr.toFixed(3)}}</small></div></div>
<p class="eng-note">Hit@{{report.k}} 为前 {{report.k}} 名中命中任一相关片段的题目比例。MRR@{{report.k}} 取首个命中名次倒数的平均值，未命中计 0。</p>
<div class="table-scroll"><table class="wrap-table"><thead><tr><th>标注查询</th><th>向量排名</th><th>BM25 排名</th><th>混合排名</th><th>操作</th></tr></thead><tbody><tr v-for="q in report.rows"><td>{{q.q}}</td><td v-for="m in ['vector','bm25','hybrid']"><span :class="q.out[m].position?'':'miss'">{{q.out[m].position||'未命中'}}</span></td><td><button class="link" @click="inspectQ=q.id">查看命中</button></td></tr></tbody></table></div></section>
<section class="card pad" v-if="inspected"><div class="card-title bare"><div><h2>单题检索明细</h2><p>{{inspected.id}} · {{inspected.q}}</p></div></div><div class="notice">标注相关片段：{{inspected.expected.map(x=>x.name+' / '+x.loc).join('、')}}</div><div class="inspect-grid"><article v-for="(n,m) in names"><h3>{{n}}</h3><ol><li v-for="h in inspected.out[m].top" :class="{relevant:h.ds===inspected.ds&&inspected.ids.includes(h.i)}"><b>{{h.name}} · v{{h.version}}</b><small>{{h.loc}} · 得分 {{h.score.toFixed(3)}}</small><p>{{h.text}}</p></li></ol><small v-if="!inspected.out[m].top.length">没有匹配词项。</small></article></div><details class="eng-detail"><summary>查看本次实验索引快照</summary><div class="chip-list"><span class="tag" v-for="d in report.snapshot">{{d.name}} · v{{d.version}} · {{d.count}} 条</span></div></details></section>
<section class="card" v-if="!report"><empty-v msg="点击运行对比实验，查看实测指标、逐题排名和来源片段。"></empty-v></section></template>
<template v-if="page==='activity'"><section class="card"><div class="filters"><label>动作筛选<select v-model="eventFilter"><option value="">全部动作</option><option v-for="a in eventNames">{{a}}</option></select></label><button class="btn" @click="exportEvents" :disabled="!events.length"><i-c name="download" :size="16"></i-c>导出记录</button><span class="count">共 {{events.length}} 条 · 最多保留最近 200 条</span></div><div class="table-scroll" v-if="events.length"><table><thead><tr><th>时间</th><th>动作</th><th>对象</th><th>版本</th><th>数量</th><th>操作</th></tr></thead><tbody><tr v-for="e in events.slice((eventPage-1)*8,eventPage*8)"><td>{{clock(e.at)}}</td><td>{{e.action}}</td><td>{{e.name}}</td><td>{{e.version?'v'+e.version:'—'}}</td><td>{{e.count}}</td><td><button class="link" @click="eventId=e.id">查看凭据</button></td></tr></tbody></table></div><empty-v v-else msg="完成一次数据登记、检索或实验后，这里会记录真实操作。"></empty-v><pager :n="eventPage" :total="events.length" @turn="eventPage=$event"></pager></section><section class="card pad" v-if="activeEvent"><div class="card-title bare"><h2>操作凭据</h2><span class="tag">{{activeEvent.id}}</span></div><dl class="kv"><dt>动作</dt><dd>{{activeEvent.action}}</dd><dt>关联对象</dt><dd>{{activeEvent.ds}} · {{activeEvent.name}}</dd><dt>执行时间</dt><dd>{{clock(activeEvent.at)}}</dd><dt>记录内容</dt><dd>{{activeEvent.detail}}</dd></dl></section></template>

<template v-if="page==='intake'"><div class="editor-grid"><section class="card pad"><div class="card-title bare"><h2>登记数据源</h2><button class="link" @click="loadExample"><i-c name="flask" :size="15"></i-c>加载示例</button></div><div class="form-grid"><label>数据集名称<input v-model.trim="draft.name" maxlength="64" placeholder="例如：近岸海温观测记录"></label><label>学科领域<select v-model="draft.domain"><option v-for="(_,k) in domains">{{k}}</option></select></label></div><div class="form-line"><label class="grow">数据类型<select v-model="draft.mode" @change="changeMode"><option value="text">描述文本 / 结构化记录</option><option value="numeric">数值张量 / 样本矩阵</option></select></label><label class="grow">输入格式<select v-model="draft.format" :disabled="draft.mode==='numeric'"><option v-for="v in draft.mode==='numeric'?['json']:['txt','csv','json']" :value="v">{{v.toUpperCase()}}</option></select></label></div>
<div class="field-title"><b>原始内容</b><label class="file-pick"><i-c name="file" :size="15"></i-c>选择文件<input type="file" ref="fileEl" :accept="draft.mode==='numeric'?'.json':'.txt,.csv,.json'" @change="loadFile"></label></div><textarea class="raw-editor" v-model="draft.input" @input="draft.file=''" :placeholder="draft.mode==='numeric'?'例如 [[12.4,11.8],[11.2,10.6]]':'每行输入一条记录，或上传 TXT、CSV、JSON 文件。'"></textarea><p class="sub">{{draft.file?'已选文件：'+draft.file:'支持粘贴或导入本地文件，单次最多 360 个片段。'}}</p><p class="error" role="alert" v-if="err">{{err}}</p><div class="action-row"><button class="btn primary" @click="register"><i-c name="database" :size="16"></i-c>解析并登记</button></div></section>
<aside class="card pad side-info"><span class="icon-tile teal"><i-c name="layers"></i-c></span><h2>片段如何生成</h2><dl class="instructions"><dt>TXT 文本</dt><dd>按非空行切分，长行按 1,400 个字符分段。</dd><dt>CSV / JSON 记录</dt><dd>保留列名或字段名，每条记录形成一个可检索片段。</dd><dt>数值张量</dt><dd>一维数组作为一个样本。高维数组沿第一轴划分样本，每个样本展平为一个向量。</dd></dl></aside></div>
<section class="card"><div class="card-title"><h2>已登记数据源</h2><span class="quiet">{{s.sources.length}} 个数据集</span></div><div class="table-scroll"><table><thead><tr><th>数据源</th><th>格式</th><th>片段数</th><th>状态</th><th>操作</th></tr></thead><tbody><tr v-for="d in s.sources"><td><ds-name :d="d"></ds-name></td><td>{{d.format}}</td><td>{{d.records.length}}</td><td><span class="badge" :class="statusClass(d)">{{d.state}}</span></td><td><button class="link" @click="toEncode(d)">{{d.state==='待编码'?'生成向量':'查看向量'}}</button></td></tr></tbody></table></div></section></template>
<template v-if="page==='encode'"><section class="card pad"><div class="card-title bare"><h2>编码配置</h2><span class="tag">本地计算</span></div><div class="form-line"><label class="grow">输入数据源<select v-model="selected" @change="resetPreview"><option v-for="d in s.sources" :value="d.id">{{d.name}} · {{d.state}}</option></select></label><label class="grow">编码器<input readonly :value="encoderName(current)"></label></div><div class="facts"><div><small>输入片段</small><b>{{current.records.length}} 条</b></div><div><small>输出维度</small><b>{{dim(current)}} D</b></div><div><small>归一化</small><b>L2 单位向量</b></div><div><small>检索度量</small><b>余弦相似度</b></div></div><div class="action-row"><button class="btn primary" @click="generate"><i-c name="bolt" :size="16"></i-c>{{current.state==='待编码'?'生成向量':'重新计算向量'}}</button><button v-if="current.state==='已生成'" class="btn" @click="writeIndex"><i-c name="database" :size="16"></i-c>写入索引</button><button v-if="current.state==='已索引'" class="btn" @click="searchSource(current)">检索此索引</button><p class="error" v-if="err" role="alert">{{err}}</p></div></section>
<section class="card"><div class="card-title"><div><h2>向量输出</h2><p>{{current.state==='待编码'?'生成后可核对每条记录的维度和实际数值。':'预览显示前 8 维，详情中可查看全部维度。'}}</p></div><button v-if="current.state!=='待编码'" class="btn" @click="exportVectors(current)"><i-c name="download" :size="16"></i-c>导出向量</button></div><empty-v v-if="current.state==='待编码'" msg="此数据源尚未编码"></empty-v><div v-else><div class="notice inline-notice"><i-c name="check" :size="16"></i-c>{{current.records.length}} 条向量已通过维度、有限值和单位范数检查 · {{current.state}}</div><div class="table-scroll"><table><thead><tr><th>向量编号 / 源位置</th><th>数值预览</th><th>维度</th><th>操作</th></tr></thead><tbody><tr v-for="(r,i) in pagedRecords"><td><b class="mono">{{vectorId(current,(recordPage-1)*8+i)}}</b><small class="cell-sub">{{r.loc}}</small></td><td><code>{{preview(r.vec)}}</code></td><td>{{r.vec.length}}</td><td><button class="link" @click="showRec({ds:current.id,i:(recordPage-1)*8+i})">完整向量</button></td></tr></tbody></table></div><pager :n="recordPage" :total="current.records.length" @turn="recordPage=$event"></pager></div></section></template>
<template v-if="page==='indexes'"><section class="card"><div class="filters"><label class="searchbox"><i-c name="search" :size="17"></i-c><input v-model="q" placeholder="按索引名称或编号搜索" aria-label="索引名称或编号"></label><select v-model="domain" aria-label="学科筛选"><option value="">全部学科</option><option v-for="(_,k) in domains">{{k}}</option></select><select v-model="kind" aria-label="编码空间筛选"><option value="">全部编码空间</option><option value="text">文本特征向量</option><option value="numeric">数值张量向量</option></select><span class="count">{{filtered.length}} 个索引</span></div><div class="table-scroll"><table><thead><tr><th>索引名称</th><th>学科领域</th><th>编码空间</th><th>向量数</th><th>维度</th><th>操作</th></tr></thead><tbody><tr v-for="d in filtered"><td><ds-name :d="d"></ds-name></td><td>{{d.domain}}</td><td>{{d.mode==='text'?'文本特征':'数值张量'}}</td><td>{{d.records.length}}</td><td class="mono">{{dim(d)}} D</td><td><button class="link" @click="browse(d)">浏览向量</button><button class="link" @click="versionOf(d)">版本 v{{d.active}}</button><button class="link" @click="searchSource(d)">检索</button></td></tr></tbody></table></div><empty-v v-if="!filtered.length" msg="没有符合筛选条件的索引"></empty-v></section></template>
<template v-if="page==='search'"><section class="card pad"><div class="card-title bare"><h2>检索条件</h2><span class="tag">{{searchMode==='text'?names[strategy]:'向量余弦'}}</span></div><div class="form-grid three"><label>查询类型<select v-model="searchMode" @change="resetSearchMode"><option value="text">文本查询</option><option value="numeric">数值张量查询</option></select></label><label>索引范围<select v-model="scope" @change="clearHits"><option value="">全部同类索引</option><option v-for="d in indexed.filter(x=>x.mode===searchMode)" :value="d.id">{{d.name}}</option></select></label><label>返回数量<select v-model.number="topK" @change="clearHits"><option v-for="k in [3,5,10]" :value="k">Top {{k}}</option></select></label></div><div class="strategy-config" v-if="searchMode==='text'"><div><strong>排序策略</strong><div class="strategy-buttons"><button v-for="(name,m) in names" :class="{chosen:strategy===m}" @click="strategy=m;clearHits()">{{name}}</button></div></div><label v-if="strategy==='hybrid'">向量权重<select v-model.number="liveWeight" @change="clearHits"><option v-for="v in [.25,.5,.6,.75]" :value="v">{{Math.round(v*100)}}%</option></select></label></div><label>{{searchMode==='text'?'查询文本':'查询张量（单个样本）'}}<textarea rows="2" v-model="query" @input="clearHits" @keydown.ctrl.enter="runSearch" :placeholder="searchMode==='text'?'输入希望查找的主题或观测特征':'例如 [12.4,11.8,10.6,9.2]'"></textarea></label><div class="search-foot"><div class="examples"><small>示例</small><button v-for="v in examples" @click="query=v;runSearch()">{{v}}</button></div><button class="btn primary" @click="runSearch"><i-c name="search" :size="16"></i-c>运行检索</button></div><p v-if="err" class="error" role="alert">{{err}}</p></section>
<section class="card"><div class="card-title"><div><h2>匹配结果</h2><p>{{meta||'结果按所选策略的得分从高到低排列。'}}</p></div><span v-if="meta" class="tag">Top {{topK}}</span></div><empty-v v-if="!hits.length" :msg="meta?'未找到符合条件的片段，请调整查询或索引范围。':'运行一次检索，查看与输入最接近的片段。'"></empty-v><article v-for="(h,n) in hits" class="hit"><span class="rank">{{String(n+1).padStart(2,'0')}}</span><div class="grow"><div class="hit-meta"><span class="tag">{{ds(h.ds).domain}}</span><small>{{ds(h.ds).name}} · v{{h.version}} · {{ds(h.ds).records[h.i].loc}}</small></div><p>{{ds(h.ds).records[h.i].text}}</p><div class="score-parts" v-if="searchMode==='text'"><span>余弦 {{h.cosine.toFixed(3)}}</span><span>BM25 {{h.bm25.toFixed(3)}}</span><span v-if="h.matched.length">匹配词项 {{h.matched.slice(0,5).join('、')}}</span></div><button class="link" @click="showRec(h)">查看原文与向量</button></div><div class="score"><strong>{{h.score.toFixed(6)}}</strong><small>{{searchMode==='numeric'||strategy==='vector'?'余弦相似度':'排序得分'}}</small></div></article></section></template>
</template><footer>北京交通大学 · 科学数据平台<span>浏览器本地演示</span></footer></main></div>
<dialog ref="dialogEl" class="dlg" @cancel.prevent="closeDialog"><template v-if="modal"><div class="dlg-head"><div><small>{{modal==='guide'?'使用帮助':modal==='collection'?'向量索引库':'向量详情'}}</small><h2>{{modal==='guide'?'页面与操作指南':modal==='collection'?subject.name:vectorId(recSource,recIndex)}}</h2></div><button class="icon-btn" aria-label="关闭窗口" @click="closeDialog"><i-c name="close"></i-c></button></div><div class="dlg-body">
<template v-if="modal==='guide'"><p class="notice">首次体验可在「数据接入」加载示例，依次点击「解析并登记」「沿用当前片段」「生成向量」「写入索引」「检索此索引」。</p><div class="guide-download"><a class="btn" href="./bjtu-vector-demo.zip" download><i-c name="download" :size="16"></i-c>下载离线网页与源码</a></div><div class="guide-row" v-for="g in guides"><button class="link" @click="closeDialog();go(g[0])">{{g[1]}}<i-c name="next" :size="14"></i-c></button><div v-for="(v,i) in g.slice(4)"><small>{{['页面板块','主要按钮','操作结果'][i]}}</small>{{v}}</div></div></template>
<template v-if="modal==='collection'"><div class="facts"><div><small>索引标识</small><b>{{subject.id}}</b></div><div><small>向量数</small><b>{{subject.records.length}}</b></div><div><small>维度</small><b>{{dim(subject)}} D</b></div></div><div class="entry" v-for="(r,j) in subject.records.slice((browsePage-1)*8,browsePage*8)"><div class="grow"><b class="mono">{{vectorId(subject,(browsePage-1)*8+j)}}</b><small>{{r.loc}} · {{r.text.slice(0,60)}}</small></div><button class="link" @click="showRec({ds:subject.id,i:(browsePage-1)*8+j},true)">查看向量</button></div><pager :total="subject.records.length" :n="browsePage" @turn="browsePage=$event"></pager><div class="dlg-actions"><button class="btn" @click="exportVectors(subject)">导出索引数据</button><button class="btn primary" @click="searchSource(subject)">检索此索引</button></div></template>
<template v-if="modal==='record'"><dl class="kv"><dt>来源数据集</dt><dd>{{recSource.name}} · {{recSource.id}}</dd><dt>来源位置</dt><dd>{{rec.loc}} · {{recSource.origin}}</dd><dt>索引版本</dt><dd>{{recSource.active?'v'+recSource.active:'待发布'}}</dd><template v-if="recSource.parent"><dt>派生来源</dt><dd>{{recSource.parent.id}} · v{{recSource.parent.version}}</dd></template><dt>编码器</dt><dd>{{encoderName(recSource)}}</dd><dt>形状与维度</dt><dd>{{rec.shape?'['+rec.shape.join(' × ')+'] → ':''}}{{rec.vec.length}} D</dd></dl><h3>输入原文 / 原始数值</h3><pre>{{rec.original||rec.sourceText||rec.text}}</pre><template v-if="rec.sourceText"><h3>实际送入编码的片段</h3><pre>{{rec.text}}</pre></template><h3>完整向量 <small>{{rec.vec.length}} 维</small></h3><pre class="vector-pre">{{JSON.stringify(rec.vec)}}</pre><div class="dlg-actions"><button v-if="backToCollection" class="btn" @click="returnCollection">返回索引</button><button v-if="recSource.state==='已索引'" class="btn primary" @click="searchWithRecord">以此片段检索</button></div></template></div></template></dialog><div v-if="toast" role="status" class="toast"><i-c name="check" :size="16"></i-c>{{toast}}</div></div>
<script src="./vendor/vue.global.js"></script><script src="./js/theme.js"></script><script src="./js/icons.js"></script><script src="./js/model.js"></script><script src="./js/engineering.js"></script><script src="./js/engineering-ui.js"></script><script src="./js/app.js"></script></body></html>
